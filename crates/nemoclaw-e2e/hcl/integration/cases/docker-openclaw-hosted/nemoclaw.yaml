# The hosted E2E case, crates/nemoclaw-e2e/hcl/cases/docker-openclaw-nvidia.yaml,
# with its first agent. The integration runner points the gateway, engine, and
# inference endpoints at its fixtures and keeps the inference path.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: hcl-openclaw
  uid: 4ab96c36-f96c-4f58-9e14-a97e0b3c4269
spec:
  gateway:
    management: managed
    runtime:
      provider: docker
    endpoint: http://127.0.0.1:17691
    engine: unix:///var/run/docker.sock
  inferenceProviders:
    nvidia:
      provider: openai
      endpoint: https://integrate.api.nvidia.com/v1
      credential:
        env: NVIDIA_INFERENCE_API_KEY
  sandboxes:
    assistant:
      harness:
        kind: nvidia.fabric.openclaw
      network:
        tier: isolated
      agent:
        name: assistant
        inference:
          routes:
            - name: primary
              providerRef: nvidia
              overrides:
                model: nvidia/nemotron-3.5-super-vl-120b-a12b
