name: Live / HCL

on:
  workflow_dispatch:
  # Like Live / Brev, opt-in pushes also work before v1 becomes the default branch.
  push:
    branches: [run-hcl-e2e/**]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: ${{ matrix.case }}
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/run-hcl-e2e/')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: docker-openclaw-vllm
            deployment: docker-openclaw-vllm-rtx-pro-6000
            # This NVIDIA GPU runner is already used by the main E2E workflow.
            runner: linux-amd64-gpu-rtxpro6000-latest-1
            secret: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    # These cases use fixed gateway ports; finish cleanup before another run starts.
    concurrency:
      group: live-hcl-${{ matrix.case }}
      cancel-in-progress: false
    env:
      CASE: ${{ matrix.case }}
      DEPLOYMENT: ${{ matrix.deployment }}
      TEST_PLATFORM: linux_amd64
      AGENT_PLATFORM: linux/amd64
      CARGO_INCREMENTAL: "0"
      E2E_RUN_NAME: hcl-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain on the GPU runner
        if: matrix.case == 'docker-openclaw-vllm'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""
      - uses: ./.github/actions/setup-rust
        with:
          platform: linux_amd64
          save-cache: "false"
      - uses: ./.github/actions/containerd-store
      - name: Require the hosted inference credential
        if: matrix.case == 'docker-openclaw-nvidia'
        env:
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [[ -z "$NVIDIA_INFERENCE_API_KEY" ]]; then
            echo '::error::NVIDIA_API_KEY is required for the hosted inference case.'
            exit 1
          fi
      - name: Build the candidate bundle and shared wrapper
        run: |
          cargo ci bundle
          cargo build --locked -p nemoclaw-e2e --bin nemoclaw-hcl-e2e
      - name: Build the OpenClaw image
        run: cargo images build --platform "$AGENT_PLATFORM" openclaw
      - name: Prepare deployment inputs
        run: |
          deployment="$RUNNER_TEMP/hcl-e2e-deployment.yaml"
          agent_digest=$(docker image inspect --format '{{.Id}}' nc-fabric:openclaw)
          [[ "$agent_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Match the existing live suites' local image-ID pins in the containerd store.
          sed "s#nc-fabric@sha256:[0-9a-f]\{64\}#nc-fabric@$agent_digest#g" \
            "crates/nemoclaw-e2e/hcl/cases/$DEPLOYMENT.yaml" > "$deployment"
          if [[ "$CASE" == docker-openclaw-vllm ]]; then
            docker buildx bake vllm --load
            digest=$(docker image inspect --format '{{.Id}}' nc-prototype-vllm:rust-v1)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            # Bind the test to this checkout's runtime image without changing the template.
            sed -i "s#nc-prototype-vllm@sha256:[0-9a-f]\{64\}#nc-prototype-vllm@$digest#" "$deployment"
          fi
      - name: Observe private GPU diagnostics during the wrapper lifecycle
        run: |
          private_dir="$RUNNER_TEMP/hcl-gpu-private"
          mkdir -m 700 "$private_dir"
          cat > "$private_dir/observe.sh" <<'BASH'
          #!/bin/bash
          set -eu
          umask 077
          run_dir=$1
          private_dir=$2
          for ((i=0; i<240; i++)); do
            [[ ! -f "$run_dir/result.json" ]] || break
            state="$run_dir/deployment/terraform.tfstate"
            if [[ -f "$state" ]]; then
              id=$(jq -r 'first(.resources[]? | select(.type == "vllm_readiness" and .name == "inference_service_inference_qwen") | .instances[]?.attributes.container_id) // empty' "$state" 2>/dev/null || true)
              if [[ "$id" =~ ^[0-9a-f]{12,64}$ ]]; then
                if timeout -k 1 5 docker logs --tail 200 "$id" > "$private_dir/vllm.next" 2>&1; then
                  mv "$private_dir/vllm.next" "$private_dir/vllm.log"
                fi
              fi
              sandbox=$(jq -r 'first(.resources[]? | select(.type == "openshell_sandbox" and .name == "assistant") | .instances[]?.attributes.id) // empty' "$state" 2>/dev/null || true)
              if [[ "$sandbox" =~ ^[0-9a-f-]{36}$ ]]; then
                container=$(docker ps -q --filter "label=openshell.ai/sandbox-id=$sandbox" --filter label=openshell.ai/isolation-role=sandbox)
                if [[ "$container" =~ ^[0-9a-f]{12,64}$ ]]; then
                  if timeout -k 1 5 docker exec --user 10001 "$container" sh -c 'find /sandbox -type f \( -name "*.log" -o -name "stderr.txt" \) -exec tail -100 {} \; 2>/dev/null || true' > "$private_dir/openclaw.next" 2>&1; then
                    mv "$private_dir/openclaw.next" "$private_dir/openclaw.log"
                  fi
                fi
              fi
            fi
            sleep 5
          done
          BASH
          nohup timeout -k 5 1200 bash "$private_dir/observe.sh" \
            "$RUNNER_TEMP/$E2E_RUN_NAME" "$private_dir" \
            > "$private_dir/observer.log" 2>&1 < /dev/null &
          echo "$!" > "$private_dir/observer.pid"
      - name: Plan, apply, verify, and destroy
        env:
          # Only the hosted case receives the inference credential.
          NVIDIA_INFERENCE_API_KEY: ${{ secrets[matrix.secret] }}
        run: |
          target/debug/nemoclaw-hcl-e2e run \
            --deployment "$RUNNER_TEMP/hcl-e2e-deployment.yaml" \
            --suite crates/nemoclaw-e2e/hcl \
            --filter "tests/$CASE.tftest.hcl" \
            --bundle "$GITHUB_WORKSPACE/dist/$TEST_PLATFORM" \
            --candidate-revision "$GITHUB_SHA" \
            --run-dir "$RUNNER_TEMP/$E2E_RUN_NAME"
      - name: Select shareable failure evidence
        if: always()
        run: |
          run_dir="$RUNNER_TEMP/$E2E_RUN_NAME"
          evidence="$RUNNER_TEMP/hcl-e2e-evidence"
          mkdir -p "$evidence"
          if [[ -f "$run_dir/result.json" ]]; then
            jq '{candidate_revision, deployment_uid, succeeded, failed_phase, failure, cleanup}' \
              "$run_dir/result.json" > "$evidence/result.json"
          fi
          for report in "$run_dir"/verifier/reports/*.json; do
            [[ -f "$report" && "$report" != *.request.json ]] || continue
            jq '{target, health, response, failure}' "$report" > "$evidence/$(basename "$report")"
          done
          # Requests, state, raw command logs, and backend diagnostics stay private.
      - name: Project fixed diagnostic signals without raw logs
        if: always()
        run: |
          private_dir="$RUNNER_TEMP/hcl-gpu-private"
          if [[ -f "$private_dir/observer.pid" ]]; then
            kill "$(cat "$private_dir/observer.pid")" 2>/dev/null || true
          fi
          evidence="$RUNNER_TEMP/hcl-e2e-evidence"
          mkdir -p "$evidence"
          for component in vllm openclaw; do
            log="$private_dir/$component.log"
            [[ -s "$log" ]] || continue
            jq -Rs --arg component "$component" '{
              target: $component,
              failure: {
                observed_at: "runtime.logs",
                signals: {
                  cuda_error: test("CUDA error|CUDA_ERROR|no kernel image|illegal memory access"; "i"),
                  memory_error: test("out of memory|OutOfMemory|KV cache.*(insufficient|not enough)"; "i"),
                  engine_failed: test("EngineCore.*(failed|died)|engine core.*(failed|died)|Worker proc.*died"; "i"),
                  context_error: test("exceed.{0,80}(context|model)|(context|prompt).{0,80}(exceed|too (long|small))|max_tokens.{0,80}(exceed|greater|at most)"; "i"),
                  authentication_error: test("No API key found|401 Unauthorized|403 Forbidden|invalid.api.key"; "i"),
                  connection_error: test("ECONNREFUSED|ENETUNREACH|EHOSTUNREACH|ETIMEDOUT|ENOTFOUND|fetch failed|Connection error"; "i"),
                  permission_error: test("EACCES|Operation not permitted|Permission denied"; "i"),
                  timeout_error: test("timed out|TimeoutError|ETIMEDOUT|deadline exceeded"; "i"),
                  chat_http_200: test("POST /v1/chat/completions HTTP/1.1. 200"),
                  chat_http_400: test("POST /v1/chat/completions HTTP/1.1. 400"),
                  chat_http_500: test("POST /v1/chat/completions HTTP/1.1. 500")
                }
              }
            }' "$log" > "$evidence/diagnostic-$component.json"
          done
          # Raw files stay private; the upload contains fixed keys and booleans only.
      - name: Upload observations and cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-e2e-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl-e2e-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
