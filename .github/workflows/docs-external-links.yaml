# Reachability check for external links in published documentation.
#
# This runs only from trusted main on a schedule, never on a pull request.
# That is the whole point of the design: the URL set is repository-owned
# (it comes from docs/ on main, not from a contributor's branch), so probing
# destinations cannot be steered by an untrusted change. A pull-request
# workflow must not probe contributor-controlled URLs, which is why
# docs-links-pr.yaml stays --local-only.
#
# A retired route in published docs is a user-visible defect (#13842), so the
# detection belongs on a schedule that sees the published set.

name: Docs / Check External Link Reachability

on:
  schedule:
    # Weekly, Monday 13:37 UTC, matching the other pin-drift checks.
    - cron: "37 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-external-links
  cancel-in-progress: false

jobs:
  external-links:
    name: Docs / Check external link reachability
    runs-on: ubuntu-latest
    # The full published set is ~1100 unique URLs and measured ~24 minutes
    # serial on a hosted runner. The checker's own probe budget stops the run
    # and names unprobed URLs before this job deadline is reached, so a slow
    # host reports a failure instead of timing out without evidence.
    timeout-minutes: 60
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to probe outside trusted main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.repository }}" != "NVIDIA/NemoClaw" ]]; then
            echo "::error::External link probing is limited to NVIDIA/NemoClaw."
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::External link probing runs only from refs/heads/main, got ${{ github.ref }}."
            exit 1
          fi

      - name: Probe external documentation links
        shell: bash
        env:
          # Generous per-URL limits: this job has a 30-minute budget and runs
          # weekly, so accuracy matters more than latency.
          CHECK_DOC_LINKS_REMOTE: "1"
          CHECK_DOC_LINKS_VERBOSE: "1"
          # Stop and name unprobed URLs well inside the 60-minute job deadline.
          CHECK_DOC_LINKS_PROBE_BUDGET_SECONDS: "2700"
        run: |
          set -euo pipefail
          bash test/e2e/e2e-cloud-experimental/check-docs.sh --only-links
