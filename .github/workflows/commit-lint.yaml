name: Governance / Lint PR Title

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      - name: Test and verify session report contract
        if: ${{ !cancelled() }}
        run: |
          npx vitest run --project integration test/automation/pull-requests/session-report.test.ts test/automation/pull-requests/session-report-workflow.test.ts
          node --import tsx scripts/checks/pr-session-report.mts --body-file .agents/skills/nemoclaw-contributor-create-pr/references/session-report-template.md

      - name: Read current PR comments
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.payload.pull_request.number, per_page: 100,
            });
            const reports = [];
            const allowed = new Map([[pr.user.login.toLowerCase(), true]]);
            for (const comment of comments) {
              if (!comment.user?.login || !comment.body?.trim().startsWith('<!-- agent-session-report:opening -->')) continue;
              const login = comment.user.login.toLowerCase();
              if (!allowed.has(login)) {
                try {
                  const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: login });
                  allowed.set(login, ['admin', 'maintain'].includes(access.role_name || access.permission));
                } catch (error) {
                  if (error.status !== 404) throw error;
                  allowed.set(login, false);
                }
              }
              if (allowed.get(login)) reports.push(comment);
            }
            require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/session-report-comments.json', JSON.stringify(reports));

      - name: Validate the opening report comment
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/checks/pr-session-report.mts --comments-file "$RUNNER_TEMP/session-report-comments.json"
