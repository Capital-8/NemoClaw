name: Docs / Check Changed Markdown Links

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".github/workflows/docs-links-pr.yaml"
      - "test/e2e/e2e-cloud-experimental/check-docs.sh"

permissions:
  contents: read

jobs:
  markdown-links:
    name: Docs / Check changed Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changed documentation files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t doc_files < <(
            # Fern pages are MDX, so both extensions must reach this checker.
            # Selecting only *.md silently skipped every docs/ page.
            git diff --name-only --diff-filter=ACMR "$base" "$head" -- \
              '*.md' \
              '*.mdx' \
              ':(exclude)node_modules/**' \
              ':(exclude)dist/**' \
              ':(exclude)vendor/**' \
              ':(exclude)build/**' \
            | LC_ALL=C sort -u
          )

          if [[ "${#doc_files[@]}" -eq 0 ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${doc_files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run markdown link checker
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t doc_files <<< "${{ steps.changed.outputs.files }}"
          # Repository-local link and Fern-route validation only. Remote probing
          # stays disabled here: this workflow runs on pull requests, so every
          # URL in the changed pages is contributor-controlled, and a safe
          # remote prober needs destination admission and redirect validation
          # that this checker does not yet implement.
          bash test/e2e/e2e-cloud-experimental/check-docs.sh --only-links --local-only "${doc_files[@]}"
